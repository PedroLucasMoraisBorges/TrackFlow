{% extends 'components/base.html' %}
{% load static %}

<!-- Aqui pode ser colocado todo o conteúdo do <head> -->
{% block head %}
<title>{{client.name}}</title>
{% endblock %}

<!-- Aqui pode ser colocado todo o conteúdo do <body> -->
{% block body %}
<form method="post">
    {% csrf_token %}

    {% for field in form %}
        {{field.label_tag}}
        {{field}}
    {% endfor %}

    <button type="submit">Cadastrar</button>
</form>
{% endblock %}

<!-- Aqui pode ser colocado todo o conteúdo do <script> ou importar scripts pelo src -->
{% block scripts %}
{% endblock %}
