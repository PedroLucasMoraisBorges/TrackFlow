{% load static %}

<div class="milestone-card" id="{{milestone.id}}">
    <div class="title">
        <div class="info">
            <img src="{% static 'imgs/info.svg' %}" alt="info">
            <h3>{{milestone.name}}</h3>
        </div>

        <div class="buttonEdit"><img src="{% static 'imgs/edit.svg' %}" alt=""></div>
    </div>

    <div class="description">
        <p class="d_title">
            Descrição
        </p>
        <p>{{milestone.description}}</p>
    </div>
</div>

<article class="milestoneDocuments">
    <div class="title">
        <div class="info">
            <img src="{% static 'imgs/info.svg' %}" alt="info">
            <h3>Arquivos anexados do {{milestone.name}} (imagens, PDF’s, arquivos, etc.)</h3>
        </div>
    </div>


    <div class="documents">
        <div class="geralDocs" id="geralDocs{{milestone.id}}">
            <div class="docList">
                {% for file in files %}
                    <a href="{{file.file.url}}" target="_blank" class="docItem">
                        <img src="{% static 'imgs/folder.svg' %}" alt="image document">
                        <p>{{file.name}}</p>
                    </a>
                {% endfor %}
            </div>
        </div>
    </div>

    <form class="uploadForm" url="{% url 'create_file' id=milestone.id type='milestone' %}">
        {% csrf_token %}
        {{file_form.file}}
        <button type="submit">Upload</button>
    </form>
</article>
