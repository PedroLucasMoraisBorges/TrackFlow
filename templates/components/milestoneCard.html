{% load static %}

<link rel="stylesheet" href="{% static 'css/milestone_card.css' %}">

<div class="milestone-card" id="{{milestone.id}}">
    <div class="title">
        <div class="info">
            <img src="{% static 'imgs/info.svg' %}" alt="info">
            <p>{{milestone.name}}</p>
        </div>

        <div class="buttonEdit"><img src="{% static 'imgs/edit.svg' %}" alt=""></div>
    </div>

    <div class="description">
        <p class="d_title">
            Descrição
        </p>
        <p>{{milestone.description}}</p>
    </div>
</div>
   <div class="general_docs"></div>
    <article class="milestoneDocuments">
        <div class="title">
            <div class="info">
                <img src="{% static 'imgs/info.svg' %}" alt="info">
                <p>Arquivos anexados do {{milestone.name}} (imagens, PDF’s, arquivos, etc.)</p>
            </div>
        </div>


 
        <div class="documents">
            <div class="geralDocs" id="geralDocs{{milestone.id}}">
                <div class="docList">
                    {% for file in files %}
                        <a href="{{file.file.url}}" target="_blank" class="docItem">
                            <img src="{% static 'imgs/folder.svg' %}" alt="image document">
                            <p>{{file.name}}</p>
                        </a>
                    {% endfor %}
                </div>
            </div>
        </div>

        <form class="uploadForm" action="{% url 'create_file' id=milestone.id type='milestone' %}" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <label class="uploadLabel">
                {{ file_form.file }}
                <span>Selecionar arquivo</span>
            </label>
            <button class="uploadButton" type="submit">Upload</button>
        </form>
    </div>

</article>
